<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8f6" />
  <title>年报速查 · A股公司财报原文</title>
  <link rel="stylesheet" href="/styles.css?v=3" />
  <script defer src="/app.js?v=2"></script>
</head>
<body>
  <main class="wrap">
    <header class="topbar"><span class="mark"><span class="mark-graphic"></span>ANNUAL / 年报速查</span></header>
    <section class="intro"><h1>找到年报，<br/><span>不用再找入口。</span></h1><p>输入股票代码或简称，直达历年年报 PDF。</p></section>
    <section class="search-section">
      <label for="stockQuery">查找上市公司</label>
      <div class="input-wrap"><span class="search-icon">⌕</span><input id="stockQuery" autocomplete="off" spellcheck="false" placeholder="搜索代码或简称，例如 000002 / 万科" /></div>
      <div id="matches" class="matches" role="listbox" hidden></div>
      <div id="lookupStatus" class="hint">正在加载…</div>
    </section>
    <section class="recent" id="recentSection" hidden><div class="section-head"><h2>最近查看</h2></div><div id="recentItems" class="recent-items"></div></section>
    <section id="resultSection" class="results" hidden>
      <div class="section-head"><div><h2 id="companyName"></h2><p id="companyMeta"></p></div><button id="refreshBtn" class="ghost-button">↻ 重新查询</button></div>
      <div id="reportsNote" class="reports-note"></div><div id="reportRows" class="reports-list"></div>
    </section>
  </main>
</body>
</html>
